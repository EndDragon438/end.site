<!DOCTYPE html>
<html lang="en">
    <head>
        {{ head }}
        <style>
            form {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: 1fr 4fr 1fr;
            }
            
            form span.required {
                color: red;
            }
            
            form * {
                display: flex;
                flex-flow: row nowrap;
                align-items: flex-start;
            }
            
            form *:nth-last-child(2) {
                grid-column: 1 / 4;
            }
        </style>
    </head>
    <body id="top">
        {{ before }}
        <main id="content">
            <p>don't mind me, i'm a testing area for development!</p>
            <iframe name="dummy_frame" id="dummy_frame" style="display: none;"></iframe>
            <input id="page" name="page" type="text" maxlength="256" placeholder="page" form="comments"> <!-- hidden and set to a default -->
            <form id="comments" action="https://end-site-backend.alwaysdata.net/comment.php" method="post" target="dummy_frame">
                <!-- page, name, website, email, body -->
                <label for="name">
                    Username<span class="required">*</span>
                    <input id="name" name="name" type="text" maxlength="128" required>
                </label>
                
                
                <label for="website">
                    Website
                    <input id="website" name="website" type="text" maxlength="128">
                </label>
                
                
                <label for="email">
                    Email
                    <input id="email" name="email" type="text" maxlength="256">
                </label>
                
                
                <label for="body">
                    Comment<span class="required">*</span>
                    <textarea id="body" name="body" required></textarea>
                </label>
                
                <button type="submit">Submit</button>
            </form>
        </main>
        {{ after }}
    </body>
</html>
